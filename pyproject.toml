[project]
name = "parltopics"
version = "0.1.0"
description = "Open, topic-agnostic classifier for Swiss parliamentary affairs on Apertus"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai>=3.35.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0.3",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
parltopics = "parltopics.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parltopics"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
