# Source: data/gold/digitalisation_definition.md (partner's definition, derived from
# PolitMonitor's actual tagging of 3,433 affairs; follows PolitMonitor where it differs from the slides).
name: Digitalisation
definition: >
  An affair is about digitalisation if it deals with digital technology, data or
  telecommunications, or with their effects on government, the economy, education, media
  or society. This includes their use, regulation, infrastructure, security and social
  consequences. The digital aspect does not have to be the only topic, but it must be a
  central part of what the affair asks or regulates, not a passing mention.
include:
  - Cybersecurity and cybercrime
  - Artificial intelligence, deepfakes, algorithms
  - Data protection, including general data protection law and data protection officers
  - E-voting and electronic identity (E-ID)
  - E-government, digital administration, open data
  - Mobile networks, 5G, broadband, fibre, including antenna permits and 5G health concerns
  - Digital education - devices, digital teaching material, computer science, smartphone bans in schools
  - Digital health - electronic patient record, health data
  - Media and public broadcasting - SRG, radio/TV licence fee, online platforms, online hate speech
  - Swiss Post - digital services, e-voting by Post, parcel deals with online platforms, changes to postal services
  - Energy use of data centres and AI
exclude:
  - Energy, solar or the economy in general, with no digital link
  - Education, labour or budgets in general, with no digital link
  - Affairs where digital technology, data or telecom is only mentioned in passing
# keywords: the core words of the pitch claim ("Digitalisierung / numérique / digitale never appears").
# All keywords match at the start of a word, case-insensitive; `*` marks an explicit prefix (digital* = digitale, digitalen …).
keywords:
  de: [Digitalisierung, digital*]
  fr: [numérique, numérisation, digital*]
  it: [digitale, digitalizzazione, digital*]
# keywords_broad: general tech vocabulary; only for the stricter tech_vocab_absent badge.
keywords_broad:
  de: [Daten, elektronisch, Cyber]
  fr: [données, électronique, cyber]
  it: [dati, elettronico, cyber]
